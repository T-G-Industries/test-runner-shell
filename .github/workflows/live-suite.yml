name: Run a suite

# The only trigger in this file is workflow_dispatch; do not add another (see
# SECURITY.md). Runs are started by hand or by the dispatch calls of poll.yml. The
# suite is an opaque code, so the run title shows no module name.
run-name: "run ${{ inputs.suite_code }}"

on:
  workflow_dispatch:
    inputs:
      sha:
        description: "Full 40-character commit SHA to test"
        type: string
        required: true
      suite_code:
        description: "Code (s01, s02, ... or c01, c02, ...)"
        type: string
        required: true
      pr:
        description: "Optional pull request number for the detailed result comment"
        type: string
        required: false
        default: ""
      # TRIAL-ONLY (SECURITY.md rule 9): check codes only. A short meaningless alias (letters
      # and digits) that the validate step looks up in a secret map. This value is public.
      pin:
        description: "Trial only: alias (a-z, 0-9, up to 20). Empty = default"
        type: string
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: suite-${{ inputs.suite_code }}-${{ inputs.sha }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash -eo pipefail {0}

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    # Secrets live in this environment, restricted to the main branch of this repository.
    environment: private-code
    # No secret at job level: each step below lists only the secrets it needs.
    env:
      SHA: ${{ inputs.sha }}
      SUITE_CODE: ${{ inputs.suite_code }}
      PR: ${{ inputs.pr }}
      WORK: ${{ github.workspace }}/../w
      OUT: ${{ github.workspace }}/../out
      TZ: Asia/Kolkata
    steps:
      - name: Validate the inputs
        id: validate
        env:
          PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_TOKEN }}
          PIN: ${{ inputs.pin }}
          PIN_MAP: ${{ secrets.PIN_MAP }}
        run: |
          [ -z "$PIN_MAP" ] || echo "::add-mask::${PIN_MAP%%$'\n'*}"
          [[ $SHA =~ ^[0-9a-f]{40}$ ]] || { echo "::error::sha must be 40 hex characters"; exit 1; }
          [[ $SUITE_CODE =~ ^[sc][0-9]{2}$ ]] || { echo "::error::bad suite code"; exit 1; }
          [[ -z $PR || $PR =~ ^[0-9]{1,6}$ ]] || { echo "::error::bad pr number"; exit 1; }
          [ -n "$PRIVATE_REPO" ] && [ -n "$PRIVATE_TOKEN" ] || { echo "::error::secrets missing"; exit 1; }
          # Trial-only pin (SECURITY.md rule 9): check codes only. The alias is public and means
          # nothing; the branch it stands for lives only in the secret PIN_MAP (one-line JSON,
          # alias -> branch name). The branch is masked the moment it is known, before any check
          # on it, and leaves this step only through the step output file (with a flag "asked", so
          # that a lost name fails the run instead of falling back to main). It is never echoed.
          # The runner script applies the name rule again.
          if [ -n "$PIN" ]; then
            [[ $SUITE_CODE =~ ^c[0-9]{2}$ ]] || { echo "::error::pin is for check codes only"; exit 1; }
            [[ $PIN =~ ^[a-z0-9]{1,20}$ ]] || { echo "::error::bad pin alias"; exit 1; }
            branch=$(python3 -I -c 'import json, os, re, sys
          try:
              v = json.loads(os.environ["PIN_MAP"])[os.environ["PIN"]]
          except Exception:
              sys.exit(1)
          if not isinstance(v, str) or not re.fullmatch(r"[\x21-\x7e]{1,200}", v) or "%" in v:
              sys.exit(1)
          sys.stdout.write(v)' 2>/dev/null) || { echo "::error::pin not available"; exit 1; }
            echo "::add-mask::$branch"
            prefix=${branch%%/*}
            if [[ $branch == */* && ${#prefix} -ge 3 ]]; then echo "::add-mask::$prefix"; fi
            [[ $branch =~ ^[A-Za-z0-9_][A-Za-z0-9._/-]{0,127}$ \
               && $branch != */ && $branch != *..* && $branch != *//* && $branch != *'@{'* \
               && $branch != main && $branch != HEAD && $branch != refs/* && $branch != origin/* ]] \
              || { echo "::error::bad pin target"; exit 1; }
            printf 'asked=1\nbranch=%s\n' "$branch" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out this repository (scripts only)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Every later step runs the scripts from this root-owned, read-only copy, and the
      # writable copy in the workspace is removed. The code under test runs as the same
      # user and the runner has passwordless sudo, so this raises the bar; it is not a
      # sandbox (see SECURITY.md rule 6).
      - name: Lock a copy of the public scripts
        id: lock
        run: |
          sudo install -d -m 0755 -o root -g root /opt/trs
          sudo cp -r scripts /opt/trs/
          sudo chown -R root:root /opt/trs
          sudo chmod -R go-w,a+rX /opt/trs
          rm -rf scripts

      - name: Mark the commit pending
        id: pending
        env:
          PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_TOKEN }}
        run: bash /opt/trs/scripts/report.sh pending

      - name: Fetch the private code (output withheld)
        id: fetch
        env:
          PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_TOKEN }}
        run: bash /opt/trs/scripts/fetch-private.sh "$WORK"

      - name: Free runner disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      # Suite codes get the token, for image loading.
      - name: Run the suite (output withheld)
        id: run_suite
        if: ${{ startsWith(inputs.suite_code, 's') }}
        env:
          PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_TOKEN }}
        run: bash /opt/trs/scripts/run-private.sh "$WORK" "$SUITE_CODE"

      # Check codes run code from the commit under test: no secret is referenced in this step.
      - name: Run the check (output withheld)
        id: run_check
        if: ${{ startsWith(inputs.suite_code, 'c') }}
        env:
          PIN_ASKED: ${{ steps.validate.outputs.asked }}
          PIN_REF: ${{ steps.validate.outputs.branch }}
        run: bash /opt/trs/scripts/run-private.sh "$WORK" "$SUITE_CODE"

      - name: Report (fixed words and numbers only)
        id: report
        if: ${{ always() && steps.validate.outcome == 'success' && steps.lock.outcome == 'success' }}
        env:
          PRIVATE_REPO: ${{ secrets.PRIVATE_REPO }}
          PRIVATE_TOKEN: ${{ secrets.PRIVATE_TOKEN }}
        run: |
          export PATH=/usr/bin:/bin
          python3 -I /opt/trs/scripts/sanitize.py "$OUT/result.json" "$OUT/exit_code" "$OUT/status.json" | tee -a "$GITHUB_STEP_SUMMARY"
          bash /opt/trs/scripts/report.sh final

      - name: Remove the private checkout
        if: always()
        run: rm -rf "$WORK" "$OUT/run.log"
